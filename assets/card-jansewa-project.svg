<svg xmlns="http://www.w3.org/2000/svg" width="380" height="230" viewBox="0 0 380 230" role="img" aria-label="Jansewa: Offline-first civic issue reporting. Reports queue in IndexedDB, sync to Firestore on reconnect. Gemini predicts priority.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1120"/><stop offset="1" stop-color="#161a30"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.5"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
<clipPath id="f"><rect width="380" height="230" rx="18"/></clipPath>
</defs>
<g clip-path="url(#f)">
<rect width="380" height="230" fill="url(#bg)"/>
<circle cx="330" cy="40" r="150" fill="url(#glow)"><animate attributeName="r" values="150;175;150" dur="6s" repeatCount="indefinite"/></circle>
<rect x="0" y="0" width="380" height="4" fill="url(#acc)"/>
<rect x="0.5" y="0.5" width="379" height="229" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
<rect x="24" y="26" width="46" height="46" rx="12" fill="#2dd4bf" fill-opacity="0.16" stroke="#2dd4bf" stroke-opacity="0.5"/>
<g transform="translate(35 37)" stroke="#2dd4bf" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 23s9-8.4 9-14A9 9 0 0 0 3 9c0 5.6 9 14 9 14z"/><circle cx="12" cy="9" r="3"/></g>
<text x="84" y="47" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#f8fafc">Jansewa</text>
<text x="84" y="66" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#2dd4bf">CIVIC TECH</text>
<text x="24" y="104" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c7cde3">Offline-first civic issue reporting. Reports</text>
<text x="24" y="125" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c7cde3">queue in IndexedDB, sync to Firestore on</text>
<text x="24" y="146" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#c7cde3">reconnect. Gemini predicts priority.</text>
<g><rect x="24" y="176" width="54" height="26" rx="13.0" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="51.0" y="193.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">React</text></g>
<g><rect x="85" y="176" width="75" height="26" rx="13.0" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="122.5" y="193.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">Firebase</text></g>
<g><rect x="167" y="176" width="75" height="26" rx="13.0" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="204.5" y="193.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">Supabase</text></g>
<g><rect x="249" y="176" width="61" height="26" rx="13.0" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.45"/><text x="279.5" y="193.32" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2dd4bf" text-anchor="middle">Gemini</text></g>
<text x="24" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6b7394">github.com/saumya-st/JANSEWA-PROJECT</text>
</g></svg>