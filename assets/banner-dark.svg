<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Saumya Tiwari, full-stack student building AI-powered apps, open to internships">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1f"/>
      <stop offset="1" stop-color="#171a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#60a5fa"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.3 0;0.3 0;-0.3 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <circle cx="980" cy="60" r="260" fill="url(#glowA)">
      <animate attributeName="cx" values="980;1020;980" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;110;60" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="280" r="240" fill="url(#glowB)">
      <animate attributeName="cx" values="1120;1060;1120" dur="12s" repeatCount="indefinite"/>
    </circle>

    <!-- code card -->
    <g transform="translate(830 62)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
      <rect width="300" height="176" rx="14" fill="#0f1326" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.12"/>
      <circle cx="20" cy="20" r="5" fill="#f87171"/><circle cx="38" cy="20" r="5" fill="#fbbf24"/><circle cx="56" cy="20" r="5" fill="#34d399"/>
      <text x="20" y="56" fill="#a5b4fc">const</text><text x="72" y="56" fill="#e2e8f0">saumya</text><text x="140" y="56" fill="#94a3b8">= {</text>
      <text x="36" y="82" fill="#f9a8d4">role:</text><text x="92" y="82" fill="#86efac">"full-stack student",</text>
      <text x="36" y="108" fill="#f9a8d4">builds:</text><text x="104" y="108" fill="#86efac">"AI-powered apps",</text>
      <text x="36" y="134" fill="#f9a8d4">status:</text><text x="104" y="134" fill="#86efac">"open to internships"</text>
      <text x="20" y="160" fill="#94a3b8">}</text>
      <rect x="258" y="148" width="9" height="17" fill="#f472b6">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- headline -->
    <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="92" font-size="17" letter-spacing="4" fill="#9aa3c7">HELLO, I AM</text>
      <text x="70" y="160" font-size="66" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">Saumya Tiwari</text>
      <rect x="72" y="178" width="220" height="5" rx="3" fill="url(#accent)"/>
      <text x="72" y="222" font-size="23" fill="#cbd5e1">Full-stack student building AI-powered web apps</text>
      <text x="72" y="256" font-size="17" fill="#8b93b8">Next.js  ·  Node.js  ·  PostgreSQL  ·  Firebase  ·  Python  ·  AWS Certified</text>
    </g>
  </g>
</svg>
